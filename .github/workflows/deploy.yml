name: Deploy to Cloudflare

# Every push to main or the build branch updates the live site on Cloudflare Workers.
on:
  push:
    branches: [main, phase-1-site-and-studio]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Check Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions."
            exit 1
          fi

      # Creates the database and media bucket the first time, then reuses them
      - name: Make sure D1 and R2 exist
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="ganders-co");console.log(db?db.uuid:"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create ganders-co
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).find(d=>d.name==="ganders-co").uuid))')
          fi
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$ID/" wrangler.jsonc
          npx wrangler r2 bucket create ganders-co-media || true

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply ganders-co --remote

      - name: Deploy
        run: npm run deploy

      # Optional secrets: copied to the Worker only when they are set in GitHub
      - name: Sync Worker secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          node -e '
            const names = ["ADMIN_PASSWORD","SESSION_SECRET","OWNER_EMAIL","RESEND_API_KEY","ANTHROPIC_API_KEY","OPENAI_API_KEY","XAI_API_KEY","GEMINI_API_KEY","OPENROUTER_API_KEY","META_PAGE_ID","META_PAGE_TOKEN","META_IG_USER_ID"];
            const out = {}; for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
            console.log("Syncing:", Object.keys(out).join(", ") || "none");'
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json

      - name: Live address
        run: echo "Deployed. Open https://ganders-co.<your-subdomain>.workers.dev (shown in the Deploy step above)."
